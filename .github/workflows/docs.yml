name: Build CGGMP24 Spec & Docs

permissions:
  contents: read

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "cggmp24/m" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b #v4.1.0
      with:
        root_file: main.tex
        working_directory: spec
    - name: Rename PDF
      run: mv spec/main.pdf spec/cggmp24-spec.pdf
    - name: Upload artifacts
      id: upload-pdf
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: spec-pdf
        path: spec/cggmp24-spec.pdf
    - name: Leave PR comment
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 #v2
      with:
        header: spec_is_built
        message: The spec was successfully compiled. PDF is available [here](${{ steps.upload-pdf.outputs.artifact-url }}).
  build_docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
    - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 #nightly on 2026-05-29
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build docs
      run: make docs && cp docs/redirect.html target/doc/index.html
    - name: Upload docs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: docs
        path: target/doc
  deploy_pages:
    runs-on: ubuntu-latest
    needs: [build_pdf, build_docs]
    if: github.ref == 'refs/heads/cggmp24/m'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: docs
        path: website
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: spec-pdf
        path: spec
    - name: Move the spec
      run: mv spec/cggmp24-spec.pdf website
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
      with:
        path: 'website'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
