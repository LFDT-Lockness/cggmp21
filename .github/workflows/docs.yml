name: Build CGGMP24 Spec & Docs

permissions:
  contents: read

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "cggmp24/m" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 #v3
      with:
        root_file: main.tex
        working_directory: spec
    - name: Rename PDF
      run: mv spec/main.pdf spec/cggmp24-spec.pdf
    - name: Upload artifacts
      id: upload-pdf
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
      with:
        name: spec-pdf
        path: spec/cggmp24-spec.pdf
    - name: Leave PR comment
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 #v2
      with:
        header: spec_is_built
        message: The spec was successfully compiled. PDF is available [here](${{ steps.upload-pdf.outputs.artifact-url }}).
  build_docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
    - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 #nightly on 2026-05-29
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 #v2
      with:
        cache-on-failure: "true"
    - name: Build docs
      run: make docs && cp docs/redirect.html target/doc/index.html
    - name: Upload docs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
      with:
        name: docs
        path: target/doc
  deploy_pages:
    runs-on: ubuntu-latest
    needs: [build_pdf, build_docs]
    if: github.ref == 'refs/heads/cggmp24/m'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
      with:
        name: docs
        path: website
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 #v4
      with:
        name: spec-pdf
        path: spec
    - name: Move the spec
      run: mv spec/cggmp24-spec.pdf website
    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa #v3
      with:
        path: 'website'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e #v4
