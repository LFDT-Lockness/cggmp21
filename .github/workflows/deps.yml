name: Deps tracker

permissions:
  contents: read

on:
  pull_request:
    branches: [ "**" ]
    paths:
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - '.github/workflows/deps.yml'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  track_deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        path: base_branch
        ref: ${{ github.base_ref }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        path: pr_branch
    - name: Retrieve base branch deps
      run: |
        cd base_branch
        cargo tree -p cggmp24 -e no-build -e no-dev --depth 1 --prefix none | tail -n +2 | sed 's/ (\*)$//' | sort -u > ../direct-deps-base
        cargo tree -p cggmp24 -e no-build -e no-dev --prefix none | tail -n +2 | sed 's/ (\*)$//' | sort -u > ../all-deps-base
    - name: Retrieve PR brach deps
      run: |
        cd pr_branch
        cargo tree -p cggmp24 -e no-build -e no-dev --depth 1 --prefix none | tail -n +2 | sed 's/ (\*)$//' | sort -u > ../direct-deps-pr
        cargo tree -p cggmp24 -e no-build -e no-dev --prefix none | tail -n +2 | sed 's/ (\*)$//' | sort -u > ../all-deps-pr
        cargo tree -p cggmp24 -e no-build -e no-dev > ../cargo-tree-pr
    - name: Diff
      shell: bash {0}
      run: |
        diff -U 0 direct-deps-base direct-deps-pr > direct-deps-diff
        if (( $? == 0 )); then echo "No changes" > direct-deps-diff; fi
        diff -U 0 all-deps-base all-deps-pr > all-deps-diff
        if (( $? == 0 )); then echo "No changes" > all-deps-diff; fi
    - name: Generate PR comment
      run: |
        cat pr_branch/.github/diff-pr-comment.tpl \
          | sed -e '/DIRECT_DEPS_DIFF/{r direct-deps-diff' -e 'd}' \
          | sed -e '/DIRECT_DEPS/{r direct-deps-pr' -e 'd}' \
          | sed -e '/CARGO_TREE/{r cargo-tree-pr' -e 'd}' \
          | sed -e '/ALL_DEPS_DIFF/{r all-deps-diff' -e 'd}' \
          > pr-comment
    - name: Publish PR comment
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 #v2.9.4
      with:
        header: deps-diff
        path: pr-comment
  
